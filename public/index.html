<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Локатор</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="map"></div>

  <button id="status" class="status" type="button" hidden>
    <span class="status-dot"></span><span id="status-text"></span>
  </button>

  <div class="fabs">
    <button id="btn-fit" class="fab" type="button" aria-label="Показать всех">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button id="btn-me" class="fab" type="button" aria-label="Где я">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
    </button>
  </div>

  <div id="toast" class="toast" hidden></div>

  <section id="sheet" class="sheet">
    <button id="sheet-toggle" class="sheet-handle" type="button" aria-label="Свернуть или развернуть список"></button>
    <header class="sheet-head">
      <h1>Друзья <span id="count" class="count"></span></h1>
      <button id="btn-invite" class="btn" type="button">Пригласить</button>
    </header>

    <div class="sheet-body">
      <div id="hint" class="hint" hidden>
        <p>Друзья видят вас, только пока открыта карта. Чтобы видели всегда, включите трансляцию в чате с ботом: 📎 → «Геопозиция» → «Транслировать».</p>
        <button id="btn-chat" class="link" type="button">Перейти в чат</button>
      </div>

      <p id="empty" class="empty" hidden>Пока никого нет. Нажмите «Пригласить» и отправьте ссылку другу — когда он согласится, подтвердите запрос в чате с ботом.</p>
      <ul id="friends" class="friends"></ul>

      <label class="toggle-row">
        <span class="toggle-text">
          <b>Показывать меня друзьям</b>
          <small id="share-note"></small>
        </span>
        <input type="checkbox" id="share-toggle">
        <span class="switch" aria-hidden="true"></span>
      </label>
    </div>
  </section>

  <div id="overlay" class="overlay" hidden><p id="overlay-text"></p></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
